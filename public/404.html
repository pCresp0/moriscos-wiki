<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Moriscos · Redirigiendo</title>
    <style>
      body {
        margin: 0;
        display: flex;
        min-height: 100vh;
        align-items: center;
        justify-content: center;
        background: #1c1814;
        color: #f4efe4;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        text-align: center;
        padding: 1.5rem;
      }
      a {
        color: #d4a359;
      }
    </style>
    <script>
      /*
       * La web es una sola página con rutas por hash. Este 404 traduce las
       * direcciones antiguas del sitio multipágina (por ejemplo
       * /moriscos-wiki/libro/05-despoblado-ribas-flecha/) a su equivalente
       * (#/libro/05-despoblado-ribas-flecha), para que los enlaces
       * compartidos y los resultados de Google sigan funcionando.
       */
      (function () {
        var base = '/moriscos-wiki/';
        window.location.replace(base);
      })();
    </script>
  </head>
  <body>
    <p>
      Redirigiendo a <a href="/moriscos-wiki/">Moriscos · Historia, Lugares y Curiosidades</a>…
    </p>
  </body>
</html>
